version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Dockerfile.frontend's final stage is a bare nginx image with no node/npm at all -
      # running `command: npm run dev` against it (as this service used to) would fail
      # immediately. Its `builder` stage still has the full source tree + node_modules on
      # a real node base, which is what `npm run dev` actually needs.
      target: builder
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Read by components/CollabManager.ts (the real multi-user collaboration client) -
      # this used to be VITE_SOCKET_URL, a name nothing in the frontend actually reads, so
      # CollabManager silently fell back to its own http://localhost:3004 default instead
      # of the backend service below (which listens on 3001 here).
      - VITE_COLLAB_SERVER_URL=http://localhost:3001
    depends_on:
      - backend
    command: npm run dev

  backend:
    build:
      # The real backend/signaling server (server/server.js) is built by the root-level
      # Dockerfile (see its own top comment), which COPYs server/package*.json and server/
      # using paths relative to the REPO ROOT - it needs the repo root as build context,
      # not ./server. This service used to point at context: ./server, dockerfile:
      # Dockerfile, which resolved to server/Dockerfile - a file that has never existed in
      # this repo, so `docker-compose up` failed to build this service at all.
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
    command: npm start

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=naviz_dev
      - POSTGRES_USER=naviz_user
      - POSTGRES_PASSWORD=naviz_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
